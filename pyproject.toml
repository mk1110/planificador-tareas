# Configuracion de despliegue en Vercel.
#
# Vercel busca una instancia de Flask llamada `app` en ficheros con nombre
# app.py / index.py / server.py / main.py / wsgi.py / asgi.py.
# Nuestro punto de entrada se llama run.py, asi que le indicamos explicitamente
# donde encontrarlo con el formato "modulo:atributo".

[tool.vercel]
entrypoint = "run:app"

[tool.vercel.scripts]
# Se ejecuta tras instalar las dependencias y antes de desplegar.
# Lo dejamos comentado a proposito: las migraciones se aplican a mano
# (ver README, seccion "Despliegue") para ver los errores y evitar que dos
# despliegues simultaneos las ejecuten a la vez.
# build = "flask --app run.py db upgrade"