{% extends "base.html" %}
{% block title %}Crear cuenta · Planificador{% endblock %}

{% block content %}
<div class="mx-auto flex min-h-[70vh] w-full max-w-md flex-col justify-center animate-fade-in-up">

  <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-soft dark:border-slate-800 dark:bg-slate-900">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-2xl bg-gradient-to-br from-blue-500 to-violet-600 text-2xl shadow-soft">✨</div>
      <h1 class="text-2xl font-bold tracking-tight">Crea tu cuenta</h1>
      <p class="mt-1.5 text-sm text-slate-500 dark:text-slate-400">Organiza tu vida en tres categorías simples.</p>
    </div>

    <form method="post" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div>
        <label for="username" class="mb-1.5 block text-sm font-semibold text-slate-700 dark:text-slate-300">
          Nombre de usuario
        </label>
        <input id="username" name="username" type="text" required autofocus autocomplete="username"
               minlength="3" maxlength="30" pattern="[A-Za-z0-9_.-]{3,30}"
               value="{{ form.username|default('') }}" placeholder="mk111"
               class="w-full rounded-xl border-slate-300 bg-white px-4 py-2.5 text-sm shadow-sm transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-blue-500 dark:border-slate-700 dark:bg-slate-950 dark:text-white">
        <p class="mt-1.5 text-xs text-slate-400">3–30 caracteres: letras, números, punto, guion o guion bajo.</p>
      </div>

      <div>
        <label for="email" class="mb-1.5 block text-sm font-semibold text-slate-700 dark:text-slate-300">
          Correo electrónico
        </label>
        <input id="email" name="email" type="email" required autocomplete="email"
               value="{{ form.email|default('') }}" placeholder="tu@correo.com"
               class="w-full rounded-xl border-slate-300 bg-white px-4 py-2.5 text-sm shadow-sm transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-blue-500 dark:border-slate-700 dark:bg-slate-950 dark:text-white">
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm font-semibold text-slate-700 dark:text-slate-300">
          Contraseña
        </label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"
               placeholder="Mínimo 8 caracteres"
               class="w-full rounded-xl border-slate-300 bg-white px-4 py-2.5 text-sm shadow-sm transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-blue-500 dark:border-slate-700 dark:bg-slate-950 dark:text-white">
      </div>

      <div>
        <label for="confirm_password" class="mb-1.5 block text-sm font-semibold text-slate-700 dark:text-slate-300">
          Repite la contraseña
        </label>
        <input id="confirm_password" name="confirm_password" type="password" required minlength="8" autocomplete="new-password"
               placeholder="••••••••"
               class="w-full rounded-xl border-slate-300 bg-white px-4 py-2.5 text-sm shadow-sm transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-blue-500 dark:border-slate-700 dark:bg-slate-950 dark:text-white">
      </div>

      <button type="submit"
              class="w-full rounded-xl bg-gradient-to-r from-blue-600 to-violet-600 px-4 py-3 text-sm font-bold text-white shadow-soft transition hover:from-blue-700 hover:to-violet-700 focus:outline-none focus:ring-4 focus:ring-blue-500/30 active:scale-[.98]">
        Crear cuenta
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500 dark:text-slate-400">
      ¿Ya tienes cuenta?
      <a href="{{ url_for('auth.login') }}"
         class="font-semibold text-blue-600 transition hover:text-blue-700 hover:underline dark:text-blue-400">
        Inicia sesión
      </a>
    </p>
  </div>
</div>
{% endblock %}
